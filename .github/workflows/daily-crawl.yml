# Daily Hackathon Data Crawler
# Automatically scrapes hackathon data from major platforms
# and commits updates to the repository.
#
# Schedule: Daily at 00:00 UTC
# Manual trigger: workflow_dispatch

name: Daily Crawl

on:
  schedule:
    - cron: "0 0 * * *"  # Every day at 00:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml requests beautifulsoup4

      - name: Validate existing data
        run: |
          python scripts/validator.py data/2026/ || true

      - name: Run scraper
        id: scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/scraper.py --output data/2026/ || {
            echo "::warning::Scraper encountered errors but continuing"
            exit 0
          }

      - name: Validate new data
        run: |
          python scripts/validator.py data/2026/ || {
            echo "::error::Validation failed after scraping"
            exit 1
          }

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected"
            git diff --stat -- data/
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: auto-update hackathon data - $(date -u +%Y-%m-%d)"
          git push

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Scraper] Daily crawl failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Daily Crawl Failure

            **Time:** ${new Date().toISOString()}
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Error Details
            The automated scraper encountered an error. Please check the Actions logs for details.

            ### Manual Steps
            1. Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Run scraper locally: \`python scripts/scraper.py --output data/2026/\`
            3. If platforms changed, update scraper in \`scripts/scraper.py\`

            cc: @maintainers`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['scraper', 'automated', 'needs-attention']
            });
